[project]
name = "chatgpt-browser-cli"
version = "0.1.0"
description = "Use Playwright Chromium to ask ChatGPT through a temporary chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "playwright>=1.62.0",
]

[project.scripts]
chatgpt-cli = "chatgpt_browser_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
